version: 2

project_name: usetix

before:
  hooks:
    - make ci

builds:
  - main: ./cmd/usetix
    binary: usetix
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: |
    ## Install

    ```sh
    go install github.com/gobijan/usetix-cli/cmd/usetix@{{ .Tag }}
    ```

    Or download the binary for your platform above and put it on your PATH.

# The cask is pushed to gobijan/homebrew-tap over SSH with a
# write-scoped deploy key stored as the HOMEBREW_TAP_DEPLOY_KEY secret.
homebrew_casks:
  - repository:
      owner: gobijan
      name: homebrew-tap
      git:
        url: git@github.com:gobijan/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    directory: Casks
    homepage: https://www.usetix.io
    description: Command-line client for the Usetix Admin API
    # Completions are not generated at install time: the quarantined binary
    # would be SIGKILLed before the postflight strips the flag. Users run
    # `usetix completion <shell>` instead.
    #
    # The binary is not signed or notarized, so strip the quarantine bit on
    # install — otherwise Gatekeeper SIGKILLs it on first run. Developer ID
    # signing + notarization can replace this later.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/usetix"]
          end
